name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        run: ./scripts/validate-version.sh

      - name: Run Swift package tests
        run: swift test
