name: Release

# Queue releases so one release cannot interrupt another halfway through.
concurrency:
  group: release
  cancel-in-progress: false

# One button creates the version PR, merges that generated PR, then publishes
# an immutable Git tag and GitHub Release for the merged commit.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Exact version, overrides bump (e.g. 0.2.0)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: macos-latest
    steps:
      # A GitHub App token is required here so creating the release PR starts
      # the normal pull-request CI workflow without manual approval.
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: vidp-labs
          repositories: vidp-engine
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Test the release commit
        run: swift test

      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '[:space:]' < VERSION)
          ./scripts/validate-version.sh
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ -n "$EXACT" ]; then
            VERSION="$EXACT"
          else
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              *)     VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$VERSION' is not a MAJOR.MINOR.PATCH version"
            exit 1
          }

          IFS='.' read -r TARGET_MAJOR TARGET_MINOR TARGET_PATCH <<< "$VERSION"
          if ((
            10#$TARGET_MAJOR < 10#$MAJOR ||
            (10#$TARGET_MAJOR == 10#$MAJOR && 10#$TARGET_MINOR < 10#$MINOR) ||
            (10#$TARGET_MAJOR == 10#$MAJOR && 10#$TARGET_MINOR == 10#$MINOR && 10#$TARGET_PATCH < 10#$PATCH)
          )); then
            echo "::error::Release version $VERSION is lower than current version $CURRENT"
            exit 1
          fi

          # A tag without a release means an earlier run failed at the last
          # step; allow that run to be finished. A published release is final.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION is already published and immutable"
            exit 1
          fi

          # VERSION already records the intended first release. In that case
          # there is no version-file diff to put in a PR, so tag main directly.
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (current v$CURRENT)"

      - name: Create and merge version PR
        if: steps.resolve.outputs.create_pr == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main
          BR="release/v$VERSION"
          git checkout -b "$BR"
          printf '%s\n' "$VERSION" > VERSION
          git add VERSION
          git diff --quiet --cached && {
            echo "::error::main is already at $VERSION -- nothing to bump"
            exit 1
          }
          git commit -m "Bump engine version to $VERSION"
          git push --quiet origin ":$BR" 2>/dev/null || true
          git push -u origin "$BR"

          gh label create release-bump --color 0E8A16 \
            --description "Automated release version change" --force
          PR_URL=$(gh pr create --base main --head "$BR" \
            --title "Release v$VERSION" \
            --body "Bumps the engine version to $VERSION for release." \
            --label release-bump)

          # This PR contains only the generated version change. Auto-merge is
          # enabled, but GitHub will wait for the required `test` check.
          gh pr merge "$PR_URL" --auto --merge --delete-branch

          for attempt in {1..60}; do
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state')
            if [ "$STATE" = "MERGED" ]; then
              break
            elif [ "$STATE" = "CLOSED" ]; then
              echo "::error::Release PR was closed without merging"
              exit 1
            fi
            echo "Waiting for release PR CI and auto-merge (attempt $attempt/60)"
            sleep 30
          done

          STATE=$(gh pr view "$PR_URL" --json state --jq '.state')
          [ "$STATE" = "MERGED" ] || {
            echo "::error::Release PR did not merge after waiting for CI"
            exit 1
          }

      - name: Tag the merged commit and create GitHub Release
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main

          if [ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]; then
            echo "::error::Merged VERSION does not match v$VERSION"
            exit 1
          fi

          # Never move a release tag. If an earlier run already pushed this tag,
          # verify it records the same version and finish the release instead.
          if git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            [ "$(git show "v$VERSION:VERSION" | tr -d '[:space:]')" = "$VERSION" ] || {
              echo "::error::Existing tag v$VERSION does not contain version $VERSION"
              exit 1
            }
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
